{% extends "base.html" %}

{% block title %}Оновити книгу{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="mb-4 text-center">Оновити інформацію про книгу</h1>

            <form method="post" action="/books/update" class="mb-4">
                <div class="mb-3">
                    <label for="name" class="form-label">Назва книги (яку оновити)</label>
                    <input type="text" name="name" id="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">Новий автор</label>
                    <input type="text" name="author" id="author" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="pages" class="form-label">Кількість сторінок</label>
                    <input type="number" name="pages" id="pages" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Категорія</label>
                    <input type="text" name="category" id="category" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-warning">Оновити</button>
            </form>

            {% if success %}
                <div class="alert alert-success text-center" role="alert">
                    {{ success }}
                </div>
            {% elif error %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ error }}
                </div>
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
