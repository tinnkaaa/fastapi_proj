<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Книжки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/books">Всі книги</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/books/create">Додати книгу</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books/delete">Видалити книгу</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Оновити книгу</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/authors">Автори</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/authors/create">Додати автора</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/categories">Категорії</a>
                    </li>
                </ul>

                <form action="/logout" method="post" class="d-flex ms-3">
                    <button type="submit" class="btn btn-outline-danger">Вийти</button>
                </form>
                
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
