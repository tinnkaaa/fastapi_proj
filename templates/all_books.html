{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for book in books %}
        <div class="col">
            <div class="card h-100">
                <img src="/static/book.jpg" class="card-img-top" alt="Book Image">
                <div class="card-body">
                    <h5 class="card-title">{{ book_name }}</h5>
                    <p class="card-text">Автор: {{ book.author }}</p>
                    <p class="card-text">Сторінок: {{ book.pages }}</p>
                    <p class="card-text">Категорія: {{ book.category }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
