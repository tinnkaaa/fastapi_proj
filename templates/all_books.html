{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for book in books %}
        <div class="col">
            <div class="card h-100">
                <h2 style="text-align: center; font-size: 24px; font-weight: bold;">
                    {{ book.name }}
                </h2>
                <div class="card-body">
                    <p>Автор: {{ book.author.first_name }} {{ book.author.last_name }}</p>
                    <p class="card-text">Сторінок: {{ book.pages }}</p>
                    <p class="card-text">Категорія: {{ book.category }}</p>
                    <a href="/books/update/{{ book.id }}" class="btn btn-warning">Оновити</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
