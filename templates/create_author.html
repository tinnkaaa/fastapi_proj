{% extends "base.html" %}

{% block title %}Додати автора{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4 text-center">Додати нового автора</h2>

            {% if success %}
                <div class="alert alert-success text-center" role="alert">
                    {{ success }}
                </div>
            {% endif %}
            {% if error %}
                <div class="alert alert-danger text-center" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" action="/authors/create">
                <div class="mb-3">
                    <label for="first_name" class="form-label">Ім'я</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" required>
                </div>

                <div class="mb-3">
                    <label for="last_name" class="form-label">Прізвище</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" required>
                </div>

                <div class="mb-3">
                    <label for="bio" class="form-label">Біографія (необов'язково)</label>
                    <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">Додати автора</button>
            </form>

            {% if success %}
                <div class="alert alert-success text-center mt-3">
                    {{ success }}
                </div>
            {% elif error %}
                <div class="alert alert-danger text-center mt-3">
                    {{ error }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
