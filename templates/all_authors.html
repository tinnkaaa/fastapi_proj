{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2 class="text-center mb-4">Список авторів</h2>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for author in authors %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">
            <a href="/authors/{{ author.id }}/books" class="text-decoration-none text-primary">
              {{ author.first_name }} {{ author.last_name }}
            </a>
          </h5>
          {% if author.bio %}
          <p class="card-text">{{ author.bio }}</p>
          {% endif %}
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
