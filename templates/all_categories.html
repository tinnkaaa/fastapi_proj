{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2 class="text-center mb-4">Список категорій</h2>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for category in categories %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">
            <a href="/categories/{{ category.id }}/books" class="text-decoration-none text-primary">
              {{ category.name }}
            </a>
          </h5>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
